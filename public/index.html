<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Scripts only from Ayva itself: a name or text a device sends can never run as code here -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ayva</title>
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <img src="/icon.svg" alt="" width="40" height="40">
      <h1>Ayva</h1>
    </div>
    <p class="muted" data-i18n="tagline"></p>

    <div class="cards">
      <a class="card" href="/share">
        <h2 data-i18n="shareTitle"></h2>
        <p data-i18n="shareDesc"></p>
      </a>
      <a class="card" href="/tv">
        <h2 data-i18n="watchTitle"></h2>
        <p data-i18n="watchDesc"></p>
      </a>
    </div>
  </div>
  <script src="/common.js"></script>
</body>
</html>
