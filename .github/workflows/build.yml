# Builds the Windows installer and the Android APK (TV and phone).
# Push a tag like v0.2.0 to attach both to a GitHub release.
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Sign with a fixed keystore (repo secret ANDROID_KEYSTORE_BASE64) so the
      # TV app updates in place. Without the secret a throwaway debug key is used.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ayva.keystore"
            echo "AYVA_KEYSTORE=$RUNNER_TEMP/ayva.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with a temporary debug key."
          fi
      - name: Build APK
        working-directory: android
        env:
          AYVA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AYVA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AYVA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk ../Ayva-Android.apk
      - uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: Ayva-Android.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - run: npx electron-builder --win --publish never
      # latest.yml and the blockmap let installed copies find and fetch updates.
      - uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            *.apk
            *.exe
            *.exe.blockmap
            latest.yml
