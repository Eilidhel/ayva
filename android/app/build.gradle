plugins {
    id 'com.android.application'
}

// Keep the TV app version in step with the desktop app (package.json).
def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version
def appVersionCode = appVersion.tokenize('.').collect { it as int }.inject(0) { acc, n -> acc * 100 + n }

android {
    namespace 'io.github.ayva.tv'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.ayva.tv'
        minSdk 21
        targetSdk 36
        versionCode appVersionCode
        // -PnameSuffix=-test.N marks test builds, so they can be told apart on the phone.
        versionName appVersion + (project.findProperty('nameSuffix') ?: '')
    }

    // Two builds of the same app. github: the APK on GitHub Releases, which
    // updates itself from there (src/github). play: the bundle for Google
    // Play, which allows updates only through Play, so it has no updater and
    // no permission to install apps (src/play).
    flavorDimensions 'store'
    productFlavors {
        github { dimension 'store' }
        play { dimension 'store' }
    }

    signingConfigs {
        // CI passes a fixed keystore so every build carries the same signature
        // and the TV app can be updated in place. Passwords default to the
        // standard debug keystore values.
        if (System.getenv('AYVA_KEYSTORE')) {
            release {
                storeFile file(System.getenv('AYVA_KEYSTORE'))
                storePassword System.getenv('AYVA_KEYSTORE_PASSWORD') ?: 'android'
                keyAlias System.getenv('AYVA_KEY_ALIAS') ?: 'androiddebugkey'
                keyPassword System.getenv('AYVA_KEY_PASSWORD') ?: 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Without AYVA_KEYSTORE, fall back to the local debug key so the APK
            // installs without extra setup.
            signingConfig System.getenv('AYVA_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // QR decoding only (pure Java, no Google Play services), for ScanActivity.
    implementation 'com.google.zxing:core:3.5.3'
    // ProxyController, so the fixed address can go through SplitProxy.
    implementation 'androidx.webkit:webkit:1.11.0'
}
